[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tinkly"
version = "0.2.0"
description = "Low-level Twinkly discovery, authentication, HTTP, and realtime UDP transport"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["tinkly*"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "griffelib>=2",
    "pytest>=9.2.0",
    "pyupgrade>=3.22.0",
    "reccy",
    "ruff>=0.17.3",
    "ty>=0.0.97",
    "tyro",
]

[tool.uv.sources]
reccy = { git = "ssh://git@github.com/rec/reccy.git", branch = "main" }

[tool.reccy.documentation]
extensions = ["scripts/griffe_tinkly.py"]
use_directory_urls = false
