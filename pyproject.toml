[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tinkly"
version = "0.1.0"
description = "Low-level Twinkly discovery, authentication, HTTP, and realtime UDP transport"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["tinkly*"]

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = ["griffelib>=2", "reccy", "tyro"]

[tool.uv.sources]
reccy = { git = "ssh://git@github.com/rec/reccy.git", branch = "main" }

[tool.reccy.documentation]
extensions = ["scripts/griffe_tinkly.py"]
